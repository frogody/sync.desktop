# Build, sign, notarize and attach the macOS app to a GitHub Release.
#
# Triggers: publishing a Release (recommended) or a manual run.
#
# Required repository secrets for SIGNED + NOTARIZED builds (Settings → Secrets
# and variables → Actions). Without the signing secrets the job still runs and
# validates the build, but skips packaging (see the "signing secrets not set"
# notice step):
#   APPLE_P12_BASE64            base64 of the Developer ID Application .p12
#   P12_PASSWORD               password for that .p12
#   KEYCHAIN_PASSWORD          any password used for the temporary build keychain
#   MAC_SIGNING_IDENTITY       e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_TEAM_ID              your Apple Developer Team ID
#   # Notarization (App Store Connect API key):
#   APPLE_API_KEY_PRIVATE_BASE64  base64 of the AuthKey_XXXX.p8
#   APPLE_API_KEY_ID              the key id (XXXX)
#   APPLE_API_KEY_ISSUER_ID       the issuer id (UUID)

name: Build & Package macOS

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS artifacts
    runs-on: macos-latest
    env:
      # NOTE: do NOT set NODE_ENV=production here — it makes `npm ci` omit
      # devDependencies (electron, vite, tsc), which breaks the better-sqlite3
      # postinstall rebuild and the build steps.
      #
      # The `secrets` context cannot be used in `if:` conditions, so surface the
      # presence of the credentials as plain env flags ('true'/'false') here.
      HAS_SIGNING: ${{ secrets.APPLE_P12_BASE64 != '' && secrets.MAC_SIGNING_IDENTITY != '' }}
      HAS_NOTARIZE: ${{ secrets.APPLE_API_KEY_PRIVATE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript & renderer (skip Swift widget in CI)
        run: |
          npm run build:main
          npm run build:renderer

      - name: Signing secrets not set — skipping package
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "::warning title=macOS packaging skipped::Apple signing secrets are not configured, so the signed/notarized .dmg was not built. Add the secrets listed at the top of build-macos.yml to enable releases."

      - name: Import macOS signing identity into temporary keychain
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          TMP_P12="/tmp/codesign.p12"
          echo "$APPLE_P12_BASE64" | base64 --decode > "$TMP_P12"
          chmod 600 "$TMP_P12"
          KEYCHAIN="$HOME/Library/Keychains/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$TMP_P12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security list-keychains -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        env:
          APPLE_P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Reconstruct App Store Connect API key for notarization
        if: env.HAS_NOTARIZE == 'true'
        run: |
          set -euo pipefail
          API_KEY_PATH="/tmp/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_PRIVATE_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_PRIVATE_BASE64: ${{ secrets.APPLE_API_KEY_PRIVATE_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}

      - name: Package macOS app (sign + notarize)
        if: env.HAS_SIGNING == 'true'
        run: npm run package:mac
        env:
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEBUG_CODESIGN: ${{ secrets.DEBUG_CODESIGN }}
          # electron-builder's built-in notarizer picks these up (App Store Connect API key)
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}

      - name: Upload artifacts (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && env.HAS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

      - name: Attach artifacts to Release
        if: ${{ github.event_name == 'release' && env.HAS_SIGNING == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
